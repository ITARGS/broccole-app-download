<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download Broccole</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 360px;
    }
    h1 { color: #2d7a3a; margin-bottom: 8px; }
    p  { color: #666; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin: 8px;
      color: white;
    }
    .ios     { background: #000; }
    .android { background: #01875f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Broccole</h1>
    <p>Redirecting you to the right store&hellip;</p>
    <a class="btn ios"     href="https://apps.apple.com/eg/app/broccole/id6746214631">App Store</a>
    <a class="btn android" href="https://play.google.com/store/apps/details?id=com.itargs.broccole.user">Google Play</a>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace("https://apps.apple.com/eg/app/broccole/id6746214631");
      } else if (/android/i.test(ua)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.itargs.broccole.user");
      }
    })();
  </script>
</body>
</html>
