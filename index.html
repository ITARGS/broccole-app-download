<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Download Broccole</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  background: #f0f7f0;
  text-align: center;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 40px 32px 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  max-width: 380px;
  width: 90%;
}
.logo {
  width: 260px;
  max-width: 100%;
  margin-bottom: 8px;
}
.hero-title {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 2rem;
  line-height: 1.3;
  color: #1a6b1a;
  text-shadow:
    3px 3px 0 #fff,
    -2px -2px 0 #fff,
    2px -2px 0 #fff,
    -2px 2px 0 #fff,
    0 3px 0 rgba(0,0,0,0.15);
  margin: 0 0 4px 0;
  letter-spacing: -0.5px;
}
.hero-subtitle {
  color: #888;
  margin-bottom: 24px;
  font-size: 14px;
  font-weight: 700;
}
.store-btn {
  display: block;
  margin: 10px auto;
  width: 100%;
  max-width: 220px;
  border-radius: 12px;
  text-decoration: none;
  transition: opacity 0.2s, transform 0.15s;
}
.store-btn:hover {
  opacity: 0.88;
  transform: scale(1.03);
}
.store-btn img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="Broccole" />
  <h1 class="hero-title">عالم كامل<br>يكبر مع طفلك</h1>
  <p class="hero-subtitle">جارٍ تحويلك إلى المتجر المناسب&hellip;</p>

  <a class="store-btn google-play" href="https://play.google.com/store/apps/details?id=com.itargs.broccole.user">
    <img src="google-play-badge.png" alt="Get it on Google Play" />
  </a>

  <a class="store-btn app-store" href="https://apps.apple.com/eg/app/broccole/id6746214631">
    <img src="app-store-badge.png" alt="Download on the App Store" />
  </a>
</div>
<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    window.location.replace("https://apps.apple.com/eg/app/broccole/id6746214631");
  } else if (/android/i.test(ua)) {
    window.location.replace("https://play.google.com/store/apps/details?id=com.itargs.broccole.user");
  }
})();
</script>
</body>
</html>
